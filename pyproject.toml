[project]
name = "lab-explainer"
version = "0.1.0"
description = "Explains diagnostics lab reports in plain language, without diagnosing."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "pydantic>=2.7",
    "reportlab>=4.1",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_explainer"]
artifacts = ["src/lab_explainer/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside fastapi.testclient, not by this project.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
